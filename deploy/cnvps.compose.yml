version: '3.5'

services:
  blog:
    image: ${BLOG_IMAGE:?Set BLOG_IMAGE to the tested release image}
    container_name: justsong-blog
    restart: always
    env_file:
      - /etc/blog-github-egress/blog.env
    ports:
      - '127.0.0.1:3001:3000'
    volumes:
      - /home/ubuntu/data/justsong-blog:/app/data
    networks:
      - github-egress

networks:
  github-egress:
    external: true
    name: blog-github-egress
